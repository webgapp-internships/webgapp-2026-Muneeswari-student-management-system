<!DOCTYPE html>
<html>

<head>

    <title>Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
            font-family:Arial;
        }

        .contact-header{
            background:#e8e8e8;
            padding:80px 20px;
            text-align:center;
        }

        .contact-header h1{
            font-size:65px;
            font-family:serif;
        }

        .contact-header p{
            font-size:22px;
            color:gray;
        }

        .contact-box{
            background:white;
            padding:40px;
            border-radius:15px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="contact-header">

        <h1>
            Contact Us
        </h1>

        <p>
            Connect with us for creative ideas and modern designs.
        </p>

    </div>

    <!-- CONTACT FORM -->

    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="contact-box shadow-lg">

                    <form>

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               class="form-control">

                        <br>

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               class="form-control">

                        <br>

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="number"
                               class="form-control">

                        <br>

                        <label class="form-label">
                            Message
                        </label>

                        <textarea rows="5"
                                  class="form-control"></textarea>

                        <br>

                        <button class="btn btn-dark w-100">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
