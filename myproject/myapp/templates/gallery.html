{% load static %}
<!DOCTYPE html>
<html>

<head>

    <title>Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f4f4;
            font-family:Arial;
        }

        .gallery-header{
            background:#ececec;
            padding:80px 20px;
            text-align:center;
        }

        .gallery-header h1{
            font-size:65px;
            font-family:serif;
        }

        .gallery-header p{
            font-size:22px;
            color:gray;
        }

        .gallery-img{
            height:320px;
            width:100%;
            object-fit:cover;
            transition:0.4s;
        }

        .gallery-img:hover{
            transform:scale(0.9);
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="gallery-header">

        <h1>
            Luxury Home Gallery
        </h1>

        <p>
            Explore unique modern homes and elegant architectural designs.
        </p>

    </div>

    <!-- GALLERY -->

    <div class="container mt-5">

        <div class="row g-4">

            <!-- IMAGE 1 -->

            <div class="col-md-4">

                <img src="{% static 'image/pla.jpg' %}"
                     class="img-fluid rounded shadow-lg gallery-img">

            </div>

            <!-- IMAGE 2 -->

            <div class="col-md-4">

                <img src="{% static 'image/unh.jpg' %}"
                     class="img-fluid rounded shadow-lg gallery-img">

            </div>

            <!-- IMAGE 3 -->

            <div class="col-md-4">

                <img src="{% static 'image/se.jpg' %}"
                     class="img-fluid rounded shadow-lg gallery-img">

            </div>

            <!-- IMAGE 4 -->

            <div class="col-md-4">

                <img src="{% static 'image/the.jpg' %}"
                     class="img-fluid rounded shadow-lg gallery-img">

            </div>

            <!-- IMAGE 5 -->

            <div class="col-md-4">

                <img src="{% static 'image/ugho.jpg' %}"
                     class="img-fluid rounded shadow-lg gallery-img">

            </div>

            <!-- IMAGE 6 -->

            <div class="col-md-4">

                <img src="{% static 'image/blank.jpg' %}"
                     class="img-fluid rounded shadow-lg gallery-img">

            </div>

        </div>

    </div>

</body>

</html>
